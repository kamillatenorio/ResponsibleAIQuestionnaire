<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="quiz-container">
        <div class="question-box">
            <p class="question-text">Generating one image using an AI system can use almost as much energy as charging your smartphone.</p>
        </div>
        <div class="options-container">
            <button class="option-button" data-answer="true"><span>1</span> True</button>
            <button class="option-button" data-answer="false"><span>2</span> False</button>
        </div>
        <div class="score-box">
            <p>Score: <span id="score">0 XP</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
