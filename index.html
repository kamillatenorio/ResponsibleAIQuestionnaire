<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsible AI Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="question-box">
            <h2 id="question">How much energy does generating one image using AI consume?</h2>
            <div class="answers">
                <button class="answer-btn" data-answer="A">
                    <span class="number">1</span> The same amount of energy as running a refrigerator for a day
                </button>
                <button class="answer-btn" data-answer="B">
                    <span class="number">2</span> Almost as much energy as charging your smartphone
                </button>
                <button class="answer-btn" data-answer="C">
                    <span class="number">3</span> It does not consume energy
                </button>
                <button class="answer-btn" data-answer="D">
                    <span class="number">4</span> None of the above
                </button>
            </div>
        </div>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
